name: Find my Telegram chat ID

# Run this once, by hand, to discover your chat ID without pasting your bot
# token into a browser URL. Steps:
#   1. Open Telegram and send your bot any message (e.g. /start).
#   2. Actions tab -> "Find my Telegram chat ID" -> Run workflow.
#   3. Read the chat ID off the run log, then save it as the
#      TELEGRAM_CHAT_ID repository secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Query getUpdates
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not set. Add it first."
            exit 1
          fi

          curl -sS "https://api.telegram.org/bot${TOKEN}/getUpdates" -o /tmp/upd.json

          python3 <<'PY'
          import json

          d = json.load(open('/tmp/upd.json'))

          if not d.get('ok'):
              print('Telegram rejected the request:', d.get('description'))
              print('The bot token is probably wrong or has been revoked.')
              raise SystemExit(1)

          results = d.get('result', [])
          if not results:
              print('No updates returned.')
              print('Send your bot a message in Telegram (e.g. /start), then re-run this workflow.')
              print('Note: getUpdates only returns the last 24 hours of messages.')
              raise SystemExit(1)

          seen = {}
          for u in results:
              msg = u.get('message') or u.get('channel_post') or {}
              chat = msg.get('chat') or {}
              cid = chat.get('id')
              if cid is not None and cid not in seen:
                  seen[cid] = chat.get('type', '?')

          print()
          print('=' * 52)
          for cid, ctype in seen.items():
              print(f'  chat_id: {cid}   (type: {ctype})')
          print('=' * 52)
          print()
          print('Save the value above as the TELEGRAM_CHAT_ID repository secret.')
          print('For a private chat with yourself, pick the "private" one.')
          PY
