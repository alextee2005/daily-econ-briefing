name: Telegram webhook (point / check / unpoint)

# Connects the bot to the Cloudflare Worker, and disconnects it again, without
# you ever pasting the bot token into a browser.
#
# setWebhook is an HTTP call, and the obvious way to make one without a terminal
# is to type the URL into the address bar — which writes the bot token into your
# browser history, autocomplete and sync. That is the same reason
# find-chat-id.yml exists. Here the token is already a repository secret, so this
# workflow makes the call and never prints it.
#
# Actions tab -> this workflow -> Run workflow, then pick:
#
#   check    what Telegram currently thinks (safe, changes nothing) — start here
#   point    send updates to the Worker. Needs worker_url.
#   unpoint  go back to polling.
#
# A webhook and getUpdates are MUTUALLY EXCLUSIVE. Pointing at the Worker stops
# polling working, and unpointing starts it again — so the TELEGRAM_DRAIN_URL
# secret must be added when you point and removed when you unpoint, or the bot
# hears nothing at all. Every run below says which of the two applies.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [check, point, unpoint, commands]
        default: check
      worker_url:
        description: "Worker URL, e.g. https://econ-briefing-bot.you.workers.dev (for 'point')"
        required: false
        default: ""

# contents: read, not {}, because the "commands" action reads the command table
# out of scripts/subscribers.py and so needs the repository. The other three
# actions talk only to Telegram's API and would still be happy with nothing.
permissions:
  contents: read

jobs:
  webhook:
    runs-on: ubuntu-latest
    steps:
      # Only "commands" needs the repository; point, check and unpoint are pure
      # API calls and stay that way. Its absence is what broke runs 6 and 7:
      # the step called scripts/subscribers.py in a workspace that held no
      # checkout, so python3 exited 2 with "No such file or directory".
      - name: Check out repository
        if: inputs.action == 'commands'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: inputs.action == 'commands'
        with:
          python-version: "3.12"

      - name: ${{ inputs.action }}
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Must be the same string as the Worker's WEBHOOK_SECRET. Telegram
          # echoes it back on every delivery, and the Worker refuses anything
          # that does not match — it is the only thing stopping a stranger from
          # POSTing "the owner approved chat X" to your Worker.
          HOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          WORKER: ${{ inputs.worker_url }}
          ACTION: ${{ inputs.action }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRAIN_URL: ${{ secrets.TELEGRAM_DRAIN_URL }}
          # Reads the subscriber list, so that "commands" can re-state each
          # subscriber's own menu. The same secret the other workflows use.
          DRAIN_SECRET: ${{ secrets.TELEGRAM_DRAIN_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is not set."
            exit 1
          fi

          api() {
            # $1 = method, $2 = JSON body (or empty). Never echoes the token.
            local method="$1" body="${2:-}"
            if [ -n "$body" ]; then
              curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                -X POST "https://api.telegram.org/bot${TOKEN}/${method}" \
                -H 'content-type: application/json' -d "$body" -o /tmp/tg.json
            else
              curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                "https://api.telegram.org/bot${TOKEN}/${method}" -o /tmp/tg.json
            fi
          }

          show() {
            python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/tg.json'))
          except Exception as exc:
              print(f"::error::Telegram's reply was not readable: {exc}")
              raise SystemExit(1)
          if not d.get('ok'):
              print(f"::error::Telegram said no: {d.get('description', '?')}")
              raise SystemExit(1)
          r = d.get('result')
          if isinstance(r, dict):
              # None of these fields carry the bot token, so printing them into a
              # public log is safe. The secret_token is never echoed by Telegram.
              url = r.get('url') or ''
              print(f"  webhook url     : {url or '(none - the bot is polled)'}")
              print(f"  pending updates : {r.get('pending_update_count', 0)}")
              if r.get('allowed_updates'):
                  print(f"  allowed updates : {', '.join(r['allowed_updates'])}")
              if r.get('last_error_message'):
                  # This is the field that explains a silent bot: a wrong secret
                  # shows up here as 403, a bad URL as a connection error.
                  #
                  # The DATE matters as much as the message. Telegram keeps the
                  # last error indefinitely and never clears it on success, so
                  # without a timestamp a long-fixed fault is indistinguishable
                  # from a live one — which cost a round of debugging exactly
                  # once. Age it explicitly.
                  import datetime as _dt
                  when = r.get('last_error_date')
                  age = ''
                  if when:
                      secs = int(_dt.datetime.now(_dt.timezone.utc).timestamp() - when)
                      age = f" ({secs // 60}m {secs % 60}s ago)"
                  print(f"::warning::Telegram's last delivery attempt failed"
                        f"{age}: {r['last_error_message']}")
                  if when and (_dt.datetime.now(_dt.timezone.utc).timestamp() - when) > 300:
                      print("  That error is more than five minutes old. If deliveries are")
                      print("  working now, Telegram simply never clears this field.")
          else:
              print(f"  result: {r}")
          PY
          }

          case "$ACTION" in
            check)
              api getWebhookInfo && show || exit 1
              echo
              echo "A url above means Telegram is pushing to the Worker and getUpdates is"
              echo "disabled. Empty means the bot is polled by subscriptions.yml instead."
              ;;

            point)
              if [ -z "${WORKER:-}" ]; then
                echo "::error::worker_url is required for 'point'."
                echo "::error::It looks like https://econ-briefing-bot.<you>.workers.dev"
                exit 1
              fi
              if [ -z "${HOOK_SECRET:-}" ]; then
                echo "::error::TELEGRAM_WEBHOOK_SECRET is not set as a repository secret."
                echo "::error::Set it to the same value as the Worker's WEBHOOK_SECRET."
                echo "::error::Without it the Worker would reject every delivery."
                exit 1
              fi
              # Telegram restricts secret_token to A-Z a-z 0-9 _ - (1-256 chars).
              # A rejected token here is a confusing failure later, so check now.
              if ! printf '%s' "$HOOK_SECRET" | grep -qE '^[A-Za-z0-9_-]{16,256}$'; then
                echo "::error::TELEGRAM_WEBHOOK_SECRET must be 16-256 characters of"
                echo "::error::letters, digits, underscore or hyphen only. Telegram"
                echo "::error::rejects anything else."
                exit 1
              fi

              URL="${WORKER%/}/telegram"
              echo "Pointing Telegram at ${URL}"
              api setWebhook "$(jq -nc \
                --arg u "$URL" --arg s "$HOOK_SECRET" \
                '{url:$u, secret_token:$s,
                  allowed_updates:["message","callback_query"],
                  drop_pending_updates:false}')" && show || exit 1

              echo
              api getWebhookInfo && show || true
              echo
              echo "::notice::Now add the repository secret TELEGRAM_DRAIN_URL = ${WORKER%/}"
              echo "::notice::(and TELEGRAM_DRAIN_SECRET = the Worker's DRAIN_SECRET)."
              echo "Until TELEGRAM_DRAIN_URL exists, subscriptions.yml keeps trying to poll"
              echo "— which now returns nothing, because the webhook has taken over. People"
              echo "will still get instant replies from the Worker; the committed list just"
              echo "will not move until you add it."
              ;;

            commands)
              # Publishes the autocomplete menus with setMyCommands. Three kinds
              # of scope, because being offered a command that then refuses you
              # is worse than never being offered it:
              #
              #   default         /start — all a stranger can usefully do
              #   owner's chat    everything, the owner-only four included
              #   each subscriber their own tier: "started", or "paid" once a
              #                   checkout has actually completed
              #
              # The Worker sets a chat's own menu as that chat changes, since it
              # is the only part that hears from Telegram in real time. This step
              # re-states them all, which is what migrates the chats that
              # subscribed before per-chat menus existed — they have no
              # chat-scoped list, so they would fall back to the default one and
              # see only /start — and repairs any the Worker failed to set.
              #
              # Whether /promo, /checkout and /manage appear depends on the
              # Worker's PAY_URL, asked rather than guessed: all three return
              # without replying until it is set, and a menu entry for a command
              # that answers nothing is worse than no entry. /health has it.
              PAYWALL=""
              if [ -z "${DRAIN_URL:-}" ]; then
                echo "TELEGRAM_DRAIN_URL is not set, so the paywall cannot be on yet."
              elif ! curl -sS --max-time 20 "${DRAIN_URL%/}/health" -o /tmp/health.json; then
                echo "::warning::Could not reach the Worker; assuming the paywall is off."
              else
                ON=$(jq -r '(.config.PAY_URL // false) | if . then "yes" else "no" end' \
                      /tmp/health.json 2>/dev/null || echo unknown)
                case "$ON" in
                  yes) PAYWALL="--paywall"
                       echo "PAY_URL is set: listing /promo, /checkout and /manage." ;;
                  no)  echo "No PAY_URL: leaving /promo, /checkout and /manage out." ;;
                  *)   echo "::warning::/health was unreadable; assuming the paywall is off." ;;
                esac
              fi

              # The per-chat menus need the subscriber list, which lives in the
              # Worker's KV and not in this repository. Deliberately not fatal:
              # without it the default and owner scopes are still published and
              # the next run picks the subscribers up.
              if [ -n "${DRAIN_URL:-}" ] && [ -n "${DRAIN_SECRET:-}" ]; then
                if curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                     -G "${DRAIN_URL%/}/list" --data-urlencode "secret=${DRAIN_SECRET}" \
                     -o /tmp/list.json; then
                  jq '.list // {}' /tmp/list.json > subscribers.json 2>/dev/null \
                    || echo "::warning::The Worker's list was not readable JSON."
                  echo "$(jq '(.approved // []) | length' subscribers.json) chat(s) on the list."
                else
                  echo "::warning::Could not read the list; per-chat menus are skipped."
                fi
              else
                echo "No list credentials, so only the default and owner menus are set."
              fi

              python3 scripts/subscribers.py commands $PAYWALL > /tmp/cmds.json
              echo "Publishing:"
              jq -r '"  default: " + ([.default[].command] | map("/" + .) | join(", "))' /tmp/cmds.json
              jq -r '"  owner:   " + ([.owner[].command] | map("/" + .) | join(", "))' /tmp/cmds.json

              api setMyCommands \
                "$(jq -c '{commands: .default, scope: {type: "default"}}' /tmp/cmds.json)" \
                && show || exit 1

              if [ -n "${OWNER_CHAT_ID:-}" ]; then
                api setMyCommands "$(jq -c --argjson c "$OWNER_CHAT_ID" \
                  '{commands: .owner, scope: {type: "chat", chat_id: $c}}' /tmp/cmds.json)" \
                  && show || exit 1
              else
                echo "::warning::TELEGRAM_CHAT_ID is not set, so the owner's own menu was"
                echo "::warning::not published. The public one was."
              fi

              # One call per subscriber. Ids are masked to their last three
              # digits because this log is public, and a failure is a warning
              # rather than fatal: one chat's menu must not stop the rest.
              N=$(jq '.chats | length' /tmp/cmds.json)
              echo
              echo "Re-stating ${N} subscriber menu(s):"
              BAD=0
              while IFS= read -r row; do
                CID=$(printf '%s' "$row" | jq -r '.chat_id')
                TIER=$(printf '%s' "$row" | jq -r '.tier')
                : > /tmp/tg.json
                api setMyCommands "$(printf '%s' "$row" \
                  | jq -c '{commands, scope: {type: "chat", chat_id: .chat_id}}')" || true
                if jq -e '.ok' /tmp/tg.json >/dev/null 2>&1; then
                  echo "  ...${CID: -3}  ${TIER}"
                else
                  echo "::warning::  ...${CID: -3} ${TIER} not set: $(jq -r '.description // "?"' /tmp/tg.json 2>/dev/null)"
                  BAD=$((BAD + 1))
                fi
              done < <(jq -c '.chats[]' /tmp/cmds.json)
              if [ "$BAD" != "0" ]; then
                echo "::warning::${BAD} chat menu(s) were not set. Re-run to retry."
              fi

              echo
              echo "Re-run this after setting PAY_URL, or the menus keep hiding"
              echo "/promo, /checkout and /manage even once they work."
              ;;

            unpoint)
              echo "Disconnecting the webhook; polling will resume."
              # drop_pending_updates:false keeps anything Telegram is holding, so
              # a /stop sent during the switch is not thrown away.
              api deleteWebhook '{"drop_pending_updates":false}' && show || exit 1
              echo
              api getWebhookInfo && show || true
              echo
              echo "::notice::Now DELETE the repository secret TELEGRAM_DRAIN_URL."
              echo "While it exists, subscriptions.yml drains a Worker that Telegram is no"
              echo "longer feeding, so nothing would be processed at all."
              ;;
          esac
