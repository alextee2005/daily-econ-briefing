name: Find my Telegram chat ID

# Two jobs in one workflow, because they are the same conversation:
#
#   1. First-time setup — discover your OWN chat ID without pasting your bot
#      token into a browser URL. Send the bot a message, run this, read the id
#      off the log, save it as the TELEGRAM_CHAT_ID secret. The owner's id
#      lives in that secret and is never committed.
#
#   2. Ongoing — enrol other people. Anyone who messages the bot is recorded in
#      subscribers.json as *pending*, which entitles them to nothing. Re-run
#      with their id in the `approve` input and they start receiving the daily
#      briefing with the next edition.
#
# Approval is deliberately a separate step. Anyone who finds the bot can
# message it, so an automatic list would mean strangers receiving the briefing
# and spending the Telegram send quota. Discovery is automatic; consent is not.
#
# You do not need this workflow to handle /start and /stop — briefing.yml does
# that itself every weekday, before it sends. This is where you *approve* what
# a /start asked for, and where you can remove someone by hand.
#
# Note that subscribers.json is committed, so approved chat IDs are public in
# this repository. Display names are printed in the run log to help you decide
# who is who, but are never stored — and on a public repository, run logs are
# public too.

on:
  workflow_dispatch:
    inputs:
      approve:
        description: "Chat IDs to start sending the briefing to (comma separated)"
        required: false
        default: ""
      remove:
        description: "Chat IDs to stop sending to, or to discard from pending"
        required: false
        default: ""

permissions:
  contents: read # the list lives in the Worker's KV, not here

concurrency:
  group: telegram-subscribers
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the subscriber list
        # It lives in Cloudflare KV, not in this repository: chat IDs are personal
        # data and this repository is public. Written to a local file so that
        # scripts/subscribers.py is unchanged by the move.
        env:
          DRAIN_URL: ${{ secrets.TELEGRAM_DRAIN_URL }}
          DRAIN_SECRET: ${{ secrets.TELEGRAM_DRAIN_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${DRAIN_URL:-}" ]; then
            echo "::error::TELEGRAM_DRAIN_URL is not set. The subscriber list lives in"
            echo "::error::the Worker's KV now — see worker/README.md."
            exit 1
          fi
          if ! curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                 -G "${DRAIN_URL%/}/list" --data-urlencode "secret=${DRAIN_SECRET}" \
                 -o /tmp/list.json; then
            echo "::error::Could not reach the Worker to read the subscriber list."
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib
          d = json.load(open('/tmp/list.json'))
          lst = d.get('list') or {"approved": [], "pending": [], "unsubscribed": [],
                                  "last_update_id": 0}
          print(f"list source: {d.get('source')}")
          pathlib.Path('subscribers.json').write_text(json.dumps(lst, indent=2) + "\n")
          PY

      - name: Apply approvals and removals
        if: inputs.approve != '' || inputs.remove != ''
        env:
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Removals first, so a mistyped id can be corrected in the same run.
          if [ -n "${{ inputs.remove }}" ]; then
            python3 scripts/subscribers.py remove "${{ inputs.remove }}"
          fi
          if [ -n "${{ inputs.approve }}" ]; then
            python3 scripts/subscribers.py approve "${{ inputs.approve }}" \
              --replies /tmp/approved.json
            # Tell each newly approved chat, here rather than on the next
            # briefing run: they have been waiting on a person, and the answer
            # should not wait on a cron as well. Only real transitions are in
            # the file, so re-approving someone does not message them again.
            bash scripts/send_replies.sh /tmp/approved.json
          fi

      - name: Look for chats that have messaged the bot
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not set. Add it first."
            exit 1
          fi

          curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
            "https://api.telegram.org/bot${TOKEN}/getUpdates" -o /tmp/upd.json

          # Check Telegram accepted the call before trusting the payload, and
          # print only its description — never the raw body, which echoes back
          # chat metadata and message text into a public log.
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/upd.json'))
          if not d.get('ok'):
              print('::error::Telegram rejected the request:', d.get('description', '?'))
              print('The bot token is probably wrong or has been revoked.')
              sys.exit(1)
          if not d.get('result'):
              print('No updates returned. Send the bot a message (e.g. /start),')
              print('then re-run this workflow. getUpdates only keeps 24 hours.')
          PY

          python3 scripts/subscribers.py sync --updates /tmp/upd.json

      - name: Store the updated list
        env:
          DRAIN_URL: ${{ secrets.TELEGRAM_DRAIN_URL }}
          DRAIN_SECRET: ${{ secrets.TELEGRAM_DRAIN_SECRET }}
        run: |
          set -uo pipefail
          CODE=$(curl -sS -o /tmp/put.json -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X PUT "${DRAIN_URL%/}/list?secret=${DRAIN_SECRET}" \
            -H 'content-type: application/json' --data-binary @subscribers.json)
          if [ "$CODE" != "200" ]; then
            echo "::error::The Worker refused the updated list (HTTP ${CODE})."
            echo "::error::Nothing has changed. Check TELEGRAM_DRAIN_SECRET."
            exit 1
          fi
          echo "Stored: $(cat /tmp/put.json)"

      - name: Show the current delivery list
        if: always()
        env:
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail

          # always(), so a run that failed earlier still says what the list looks
          # like. "Did my approval actually land?" is the question this page
          # exists to answer, and a failed run is exactly when it is asked.
          COUNT=$(python3 scripts/subscribers.py recipients 2>/dev/null | wc -l)
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          p = pathlib.Path("subscribers.json")
          d = json.loads(p.read_text()) if p.is_file() else {}
          owner = (os.environ.get("OWNER_CHAT_ID") or "").strip()

          def row(key, label):
              n = len(d.get(key) or [])
              who = ", ".join(f"`{e['chat_id']}`" for e in (d.get(key) or [])) or "—"
              return f"| {label} | {n} | {who} |"

          print("## Briefing delivery list\n")
          print(f"**{1 if owner else 0} owner + {len(d.get('approved') or [])} "
                "subscriber(s)** will receive the next edition.\n")
          print("| list | count | chats |")
          print("|---|---|---|")
          print(row("approved", "receiving it"))
          print(row("pending", "awaiting approval"))
          print(row("unsubscribed", "opted out"))
          print()
          if not owner:
              print("> `TELEGRAM_CHAT_ID` is **not set**, so the owner receives nothing. "
                    "Only the subscribers above are sent to.\n")
          else:
              print("The owner's chat ID comes from the `TELEGRAM_CHAT_ID` secret and is "
                    "deliberately not listed here.\n")
          if d.get("pending"):
              print("To enrol someone, re-run this workflow with their id in the "
                    "`approve` input — or reply `/approve <id>` to the bot, which the "
                    "next briefing run applies.")
          PY
          echo "Recipients for the next edition: ${COUNT}"
