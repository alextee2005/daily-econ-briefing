name: Deliver briefing to Telegram

# Fires whenever a new PDF lands in editions/.
# Also runnable by hand from the Actions tab (optionally naming a specific file).
#
# Sends to the owner (the TELEGRAM_CHAT_ID secret) plus every approved chat in
# subscribers.json. Use the "Find my Telegram chat ID" workflow to enrol people.
#
# It applies any queued subscription decisions before reading the list, so that
# entitlement is judged on what people have actually asked for and paid for
# rather than on whenever GitHub last ran the poller. It does not enrol or
# answer anybody; see the step for why that matters.

on:
  push:
    # Restricted to main. Without this a push to any feature branch that
    # carries main's edition commits matches the path filter and delivers —
    # which is how every subscriber was sent the 7 September edition on
    # 22 October 2026 from a branch that touched no PDF at all.
    branches:
      - main
    paths:
      - 'editions/**.pdf'
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to a specific PDF to send (leave blank for the newest)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: telegram-delivery
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select the PDF to send
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.file }}
        run: |
          set -euo pipefail

          # A PDF this push actually added, if any. Empty is normal and fine —
          # the picker decides what that means.
          CHANGED="$(git diff --name-only --diff-filter=AM HEAD~1 HEAD \
            -- 'editions/*.pdf' 2>/dev/null | tail -n 1 || true)"

          # Selection lives in scripts/pick_edition.py, under test, because the
          # version inlined here sorted filenames as bytes and this repository
          # uses two date conventions — see that file's header.
          python3 scripts/pick_edition.py \
            --manual "${MANUAL:-}" --changed "$CHANGED" | tee /tmp/pick.env
          cat /tmp/pick.env >> "$GITHUB_OUTPUT"

          PDF="$(sed -n 's/^pdf=//p' /tmp/pick.env)"
          SIZE_MB=$(( $(stat -c%s "$PDF") / 1048576 ))
          if [ "$SIZE_MB" -ge 50 ]; then
            echo "::error::$PDF is ${SIZE_MB}MB; Telegram's sendDocument limit is 50MB."
            exit 1
          fi
          echo "Selected: $PDF (${SIZE_MB}MB)"

      - name: Apply queued subscriptions before reading the list
        # WHY THIS IS HERE AND NOT LEFT TO THE POLLER
        # subscriptions.yml declares "*/5 * * * *", but GitHub does not honour
        # that. Measured over the 20 runs to 2026-11-05, the mean gap between
        # fires was 5h47m and the longest was 10h06m — roughly 1.5% of the
        # declared cadence, which is why run numbers are in the hundreds rather
        # than the tens of thousands.
        #
        # For most bookkeeping that lag is harmless: under the webhook the
        # Worker has already answered the person in milliseconds, and reminders
        # are day-granular. One case is not harmless. Once the paywall is
        # enforced, entitlement is read HERE, at delivery time. Someone who pays
        # in the hours before an edition goes out would be filtered out of the
        # edition they just paid for, because the grant was still sitting in the
        # queue. Draining first makes the cron cadence irrelevant to the only
        # moment where staleness costs a subscriber something.
        #
        # Never fatal, like every other list step in this workflow: a briefing
        # that reaches people matters more than up-to-the-second bookkeeping. On
        # any failure this falls through and the fetch below reads whatever the
        # Worker currently holds.
        #
        # This drains the same queue as subscriptions.yml and the two workflows
        # have separate concurrency groups, so they can overlap. That is safe:
        # apply_queue() is idempotent, the queue only hands items out on read and
        # deletes them on acknowledgement, and an item that loses a race stays
        # queued for the next drain.
        env:
          DRAIN_URL: ${{ secrets.TELEGRAM_DRAIN_URL }}
          DRAIN_SECRET: ${{ secrets.TELEGRAM_DRAIN_SECRET }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail

          skip() { echo "::warning::$1"; echo "::warning::Delivering against the list as it currently stands."; exit 0; }

          if [ -z "${DRAIN_URL:-}" ]; then
            echo "TELEGRAM_DRAIN_URL is not set; nothing to drain."
            exit 0
          fi

          # The queue is applied to the list as the Worker holds it, so fetch it
          # first. The step below re-reads it afterwards; that second read is
          # what delivery actually uses, and it doubles as proof the store landed.
          if ! curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                 -G "${DRAIN_URL%/}/list" --data-urlencode "secret=${DRAIN_SECRET}" \
                 -o /tmp/pre.json; then
            skip "Could not reach the Worker to read the list before draining."
          fi
          python3 - <<'PY' || exit 0
          import json, pathlib, sys
          try:
              lst = (json.load(open('/tmp/pre.json')) or {}).get('list')
          except Exception as exc:
              print(f"::warning::The Worker's list was not readable JSON: {exc}")
              sys.exit(1)
          if lst is None:
              print("::warning::The Worker holds no list yet; nothing to drain into.")
              sys.exit(1)
          pathlib.Path('subscribers.json').write_text(json.dumps(lst, indent=2) + "\n")
          PY
          [ -s subscribers.json ] || skip "No list to apply queued decisions to."

          if ! curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                 -G "${DRAIN_URL%/}/queue" --data-urlencode "secret=${DRAIN_SECRET}" \
                 -o /tmp/queue.json; then
            skip "Could not reach the Worker to read the queue."
          fi

          COUNT=$(python3 -c "
          import json
          try: print(len(json.load(open('/tmp/queue.json')).get('items') or []))
          except Exception: print(-1)
          " 2>/dev/null || echo -1)

          if [ "$COUNT" = "-1" ]; then
            skip "The Worker's queue reply was not readable JSON."
          fi
          echo "${COUNT} queued decision(s) waiting at delivery time."
          if [ "$COUNT" = "0" ]; then exit 0; fi

          # Applies verbs only. This sends nobody anything: the drain action
          # writes the ids to acknowledge, and under the webhook the Worker
          # already replied to each person when it queued the decision.
          #
          # subscribers.py now masks chat ids on the way out of the process,
          # so its stdout is already safe. The two guards below are kept as a
          # second line of defence rather than the only one: a raw id could
          # still reach this log through a traceback, or through a print added
          # later by someone who has not read that module's header. The step
          # summary is discarded because deliver.yml writes its own, not
          # because the drain's is unsafe.
          if ! GITHUB_STEP_SUMMARY=/dev/null \
               python3 scripts/subscribers.py drain \
                 --updates /tmp/queue.json --replies /tmp/ack.json \
                 > /tmp/drain.log 2>&1; then
            sed -E 's/[0-9]{3,}([0-9]{3})/…\1/g' /tmp/drain.log | tail -20
            skip "Could not apply the queued decisions."
          fi
          sed -E 's/[0-9]{3,}([0-9]{3})/…\1/g' /tmp/drain.log

          # Store, then acknowledge, in that order and never the other way: an
          # acknowledgement for a decision that never landed deletes it, which
          # is how an opt-out vanishes silently.
          CODE=$(curl -sS -o /tmp/put.json -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -X PUT "${DRAIN_URL%/}/list?secret=${DRAIN_SECRET}" \
            -H 'content-type: application/json' --data-binary @subscribers.json)
          if [ "$CODE" != "200" ]; then
            echo "::warning::The Worker refused the updated list (HTTP ${CODE})."
            echo "::warning::Not acknowledged, so the poller replays these items."
            skip "Queued decisions were not applied before this delivery."
          fi
          echo "Stored: $(cat /tmp/put.json)"

          if ! curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                 -X POST "${DRAIN_URL%/}/ack?secret=${DRAIN_SECRET}" \
                 -H 'content-type: application/json' \
                 -d "{\"ids\": $(cat /tmp/ack.json)}" -o /tmp/ack_resp.json; then
            echo "::warning::Applied and stored, but the queue was not acknowledged."
            echo "::warning::The poller replays these items; applying them again is"
            echo "::warning::a no-op, so nothing is lost or duplicated."
            exit 0
          fi
          echo "Applied and acknowledged $(python3 -c "import json; print(len(json.load(open('/tmp/ack.json'))))") item(s)."

      - name: Fetch the subscriber list
        # The list lives in Cloudflare KV, not in this repository — chat IDs are
        # personal data and this repository is public. Fetched here so that
        # scripts/subscribers.py still just reads a local file, keeping all of its
        # tested code paths unchanged.
        env:
          DRAIN_URL: ${{ secrets.TELEGRAM_DRAIN_URL }}
          DRAIN_SECRET: ${{ secrets.TELEGRAM_DRAIN_SECRET }}
        run: |
          set -uo pipefail

          # Deliberately never fatal. A briefing that reaches the owner is far
          # better than no briefing, so every failure here degrades to owner-only
          # and says so loudly rather than stopping the delivery.
          warn_owner_only() {
            echo "::warning::$1"
            echo "::warning::Delivering to the owner only. Subscribers will NOT receive"
            echo "::warning::this edition. Fix before the next one."
            rm -f subscribers.json
          }

          if [ -z "${DRAIN_URL:-}" ]; then
            warn_owner_only "TELEGRAM_DRAIN_URL is not set, so the subscriber list cannot be read."
            exit 0
          fi

          if ! curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
                 -G "${DRAIN_URL%/}/list" --data-urlencode "secret=${DRAIN_SECRET}" \
                 -o /tmp/list.json; then
            warn_owner_only "Could not reach the Worker to read the subscriber list."
            exit 0
          fi

          python3 - <<'PY' || exit 0
          import json, pathlib, sys
          try:
              d = json.load(open('/tmp/list.json'))
          except Exception as exc:
              print(f"::warning::The Worker's reply was not readable JSON: {exc}")
              print("::warning::Delivering to the owner only.")
              pathlib.Path('subscribers.json').unlink(missing_ok=True)
              sys.exit(0)
          lst = d.get('list') or {"approved": [], "pending": [], "unsubscribed": []}
          n = len(lst.get('approved') or [])
          print(f"list source: {d.get('source')}; {n} approved subscriber(s)")
          pathlib.Path('subscribers.json').write_text(json.dumps(lst, indent=2) + "\n")
          PY

      - name: Send to every recipient
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PDF: ${{ steps.pick.outputs.pdf }}
          EDITION_DATE: ${{ steps.pick.outputs.edition_date }}
          WHY: ${{ steps.pick.outputs.why }}
          PAY_URL: ${{ secrets.STRIPE_PAY_URL }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not set."
            exit 1
          fi

          # Owner first, then approved subscribers. One id per line.
          #
          # The paywall is applied only when STRIPE_PAY_URL is set, and that
          # gate is deliberately this way round rather than the other. The
          # harmful misconfiguration is enforcing without selling: subscribers
          # cut off with no link to pay. Keyed on the pay link, that state
          # cannot arise — no link, no enforcement. The opposite slip (selling
          # while still delivering to everyone) costs nothing but revenue and
          # announces itself in the table below.
          #
          # --editions is what makes the trial countable: entitlement for a
          # trial chat is computed from the editions committed since it
          # started, not from a counter, so nothing here writes to the list.
          if [ -n "${PAY_URL:-}" ]; then
            mapfile -t RECIPIENTS < <(python3 scripts/subscribers.py recipients \
              --editions editions --report /tmp/entitlement.md)
            PAYWALL="on"
          else
            mapfile -t RECIPIENTS < <(python3 scripts/subscribers.py recipients)
            PAYWALL="off"
          fi

          if [ "${#RECIPIENTS[@]}" -eq 0 ]; then
            echo "::error::No recipients. Set TELEGRAM_CHAT_ID, or approve a subscriber"
            echo "::error::with the 'Find my Telegram chat ID' workflow."
            exit 1
          fi

          # The owner is never filtered, so a list of exactly one under an
          # active paywall means every subscriber was excluded. That is either
          # a genuinely empty paid list or the paywall misfiring, and the two
          # need opposite responses — so say it loudly rather than letting a
          # quiet "1 recipient" pass for normal.
          APPROVED=$(python3 -c "
          import json, pathlib
          p = pathlib.Path('subscribers.json')
          d = json.loads(p.read_text()) if p.is_file() else {}
          print(len(d.get('approved') or []))
          " 2>/dev/null || echo 0)
          if [ "$PAYWALL" = "on" ] && [ "${#RECIPIENTS[@]}" -le 1 ] \
             && [ "$APPROVED" -gt 0 ]; then
            echo "::warning::The paywall excluded ALL ${APPROVED} subscriber(s);"
            echo "::warning::only the owner is receiving this edition. If that is"
            echo "::warning::not expected, check the entitlement table in the"
            echo "::warning::summary before the next edition."
          fi

          # The parsed date, not the raw filename suffix: the early editions
          # are named ..._20260907.pdf and captioning one "Daily Economic
          # Briefing — 20260907" is how a wrong file looks almost right.
          CAPTION="Daily Economic Briefing — ${EDITION_DATE}"
          echo "Sending ${PDF} (${EDITION_DATE}, ${WHY}) to ${#RECIPIENTS[@]} recipient(s)."

          # Reads /tmp/tg.json and prints one line: "ok|<file_id>|<description>".
          # Only these three fields ever leave the response — the raw body
          # echoes chat metadata, and these logs are public.
          read_reply() {
            python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/tg.json'))
          except Exception as exc:
              print(f"no|error|unparseable response: {exc}")
          else:
              doc = (d.get('result') or {}).get('document') or {}
              print("{}|{}|{}".format(
                  'yes' if d.get('ok') else 'no',
                  doc.get('file_id', ''),
                  (d.get('description') or 'none').replace('|', '/'),
              ))
          PY
          }

          # One send. Never aborts the job: a curl that fails at the network
          # level (rather than returning an HTTP error) would otherwise kill the
          # loop mid-list under `set -e` and skip the summary, losing both the
          # remaining recipients and the record of who did get it.
          send_to() {
            local chat="$1" docarg="$2" http rc
            set +e
            http=$(curl -sS --retry 3 --retry-delay 5 --retry-all-errors \
              -o /tmp/tg.json -w '%{http_code}' \
              -F "chat_id=${chat}" -F "caption=${CAPTION}" \
              -F "document=${docarg}" \
              "https://api.telegram.org/bot${TOKEN}/sendDocument")
            rc=$?
            set -e
            if [ "$rc" != "0" ]; then
              echo '{"ok":false,"description":"curl failed to reach Telegram"}' > /tmp/tg.json
              http="000"
            fi
            printf '%s' "$http"
          }

          FILE_ID=""
          FAILED=()
          SENT=0
          ROWS=""
          STARTED=$(date +%s)

          for i in "${!RECIPIENTS[@]}"; do
            CHAT="${RECIPIENTS[$i]}"
            # Recipient zero is the owner when one is configured; naming the
            # role in the table saves cross-referencing the secret to work out
            # whose delivery failed.
            if [ "$i" = "0" ] && [ -n "${OWNER_CHAT_ID:-}" ]; then
              ROLE="owner"
            else
              ROLE="subscriber"
            fi

            # Never the whole id. These logs are public, and keeping chat ids
            # out of the repository is the entire reason the subscriber list
            # was moved to the Worker's KV — printing them here every morning
            # put them straight back. The last three digits are enough to tell
            # two rows apart when one delivery fails.
            SHOWN="…${CHAT: -3}"

            # Upload the PDF once. Telegram returns a file_id for the stored
            # copy, and every later send reuses it — so a list of twenty costs
            # one upload, not twenty, and the sends are far less likely to time
            # out. A file_id is also how the same document arrives identically
            # for everyone rather than as N separate uploads.
            if [ -z "$FILE_ID" ]; then
              HTTP=$(send_to "$CHAT" "@${PDF};type=application/pdf")
            else
              HTTP=$(send_to "$CHAT" "$FILE_ID")
            fi

            IFS='|' read -r OK NEW_ID DESC <<< "$(read_reply)"

            if [ -z "$FILE_ID" ]; then HOW="uploaded"; else HOW="reused file_id"; fi

            if [ "$HTTP" = "200" ] && [ "$OK" = "yes" ]; then
              SENT=$((SENT + 1))
              # Guarded with `if` rather than a && chain: the chain is exempt
              # from `set -e` today only because the assignment is last, which
              # is too subtle to rely on in an unattended path.
              if [ -z "$FILE_ID" ] && [ -n "$NEW_ID" ]; then
                FILE_ID="$NEW_ID"
              fi
              echo "  sent to ${SHOWN} (${HOW})"
              ROWS="${ROWS}| \`${SHOWN}\` | ${ROLE} | ${HOW} | sent |"$'\n'
            else
              ROWS="${ROWS}| \`${SHOWN}\` | ${ROLE} | ${HOW} | **failed** — HTTP ${HTTP}: ${DESC} |"$'\n'
              FAILED+=("${SHOWN} (HTTP ${HTTP}: ${DESC})")
              echo "::warning::Delivery to ${SHOWN} failed — HTTP ${HTTP}: ${DESC}"
              # The owner is first in the list. If their delivery fails the
              # whole thing is broken, not one stale subscriber, and the
              # file_id needed by everyone else was never issued.
              if [ "$i" = "0" ] && [ -n "${OWNER_CHAT_ID:-}" ]; then
                echo "::error::The owner's delivery failed. Check the bot token, the"
                echo "::error::TELEGRAM_CHAT_ID secret, and that you have sent /start."
                exit 1
              fi
            fi

            # Stay well inside Telegram's bulk limits. Skipped after the last
            # one so a single-recipient send is not needlessly slower.
            [ "$i" -lt "$(( ${#RECIPIENTS[@]} - 1 ))" ] && sleep 1 || true
          done

          ELAPSED=$(( $(date +%s) - STARTED ))

          # Every recipient is listed, not only the failures: a run that says
          # nothing about who received it cannot be checked afterwards, and
          # "delivered" with the wrong recipient count is the failure that would
          # otherwise go unnoticed.
          {
            echo "## Telegram delivery"
            echo
            echo "\`${PDF}\` ($(( $(stat -c%s "$PDF") / 1024 )) KB) — "\
                 "**${SENT} of ${#RECIPIENTS[@]} delivered** in ${ELAPSED}s."
            echo
            echo "Edition **${EDITION_DATE}**, chosen because it was ${WHY}."
            echo
            echo "| chat | role | transfer | result |"
            echo "|---|---|---|---|"
            printf '%s' "$ROWS"
            if [ "${#FAILED[@]}" -gt 0 ]; then
              echo
              echo "A chat that has blocked the bot or been deleted will fail every"
              echo "morning. Drop it with the \`remove\` input on **Find my Telegram"
              echo "chat ID**, or let the subscriber send /stop."
            fi
            echo
            echo "One upload plus $(( SENT > 0 ? SENT - 1 : 0 )) file_id reuse(s)."
            if [ "$PAYWALL" = "on" ] && [ -s /tmp/entitlement.md ]; then
              echo
              echo "### Entitlement"
              echo
              # Every approved chat and why it did or did not receive this
              # edition. A recipient count alone cannot tell "nobody has paid"
              # from "the paywall is broken".
              cat /tmp/entitlement.md
            elif [ "$PAYWALL" = "off" ]; then
              echo
              echo "_Paywall off (no \`STRIPE_PAY_URL\`): every approved chat received this._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${#FAILED[@]}" -gt 0 ]; then
            echo "Delivered to ${SENT}/${#RECIPIENTS[@]}; ${#FAILED[@]} subscriber(s) failed."
          else
            echo "Delivered ${PDF} to all ${SENT} recipient(s)."
          fi
